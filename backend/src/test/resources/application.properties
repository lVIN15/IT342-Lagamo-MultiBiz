spring.application.name=multibiz

# ── H2 In-Memory Database ─────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=TestSecretKeyForJWTMustBeAtLeast256BitsLongForHS256AlgorithmUsage123456
jwt.access-expiration-ms=3600000
jwt.refresh-expiration-ms=86400000

# ── Google OAuth (mock) ───────────────────────────────────────────────────────
google.client.id=test-google-client-id

# ── PayMongo (mock) ──────────────────────────────────────────────────────────
paymongo.secret-key=sk_test_mock_key
paymongo.public-key=pk_test_mock_key
paymongo.webhook-secret=whsk_test_mock

# ── Mail (mock) ──────────────────────────────────────────────────────────────
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test

# ── Upload Limits ─────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
