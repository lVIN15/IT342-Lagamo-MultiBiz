spring.application.name=multibiz

# ─── Supabase PostgreSQL – Session Pooler ────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── HikariCP Pooler Configs for Supabase PgBouncer (Stay backend alive for 9 mins) ──────────────────────────
spring.datasource.hikari.max-lifetime=540000
spring.datasource.hikari.keepalive-time=45000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── JWT ─────────────────────────────────────────────────────────────────────
# 256-bit (32-byte) HMAC-SHA-256 secret – change before going to production!
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000

# ─── MAIL (SMTP config for capstone requirement) ─────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ─── Google OAuth ────────────────────────────────────────────────────────────
google.client.id=${GOOGLE_CLIENT_ID}

# ─── Upload Limits (Fixing Camera Upload Error) ──────────────────────────────
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# ─── PayMongo (keys loaded from .env via spring-dotenv) ──────────────────────
paymongo.secret-key=${PAYMONGO_SECRET_KEY}
paymongo.public-key=${PAYMONGO_PUBLIC_KEY}
paymongo.webhook-secret=${PAYMONGO_WEBHOOK_SECRET}
